# G-Scores in Docker. Run from the repo root.
#
# Database only (local development; `npm run dev` runs the API and web on the host):
#   docker compose -f infrastructure/docker-compose.yaml up -d --wait
#
# Whole app (PostgreSQL + migrate + seed + API + web), the profile "app":
#   ./docker-up.sh      (= docker compose -f infrastructure/docker-compose.yaml --profile app up -d --build)
#   ./docker-down.sh    (stops the containers, keeps the data)
#
# Local-only: ports are bound to 127.0.0.1 and PostgreSQL uses trust auth (no password), so there
# is no secret in this file. Do not reuse this setup on a public host.
name: g-scores

x-app-build: &app-build
  context: ..
  dockerfile: infrastructure/docker/Dockerfile

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres@postgres:5432/g_scores

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: g_scores
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is first created; adds the disposable test database.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g_scores"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations, then seed. Seeding is a no-op once the table is full (GS-01-AC05).
  # Never pass --fresh here: it deletes data.
  seed:
    profiles: [app]
    build:
      <<: *app-build
      target: api
    image: g-scores-api
    environment: *app-env
    command: ["sh", "-c", "npm run db:migrate -w backend && npm run db:seed -w backend"]
    volumes:
      # Read-only: the dataset cannot be modified from the container (GS-01-AC07).
      - ../dataset:/app/dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      <<: *app-build
      target: api
    image: g-scores-api
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "4000"
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    profiles: [app]
    build:
      <<: *app-build
      target: web
      args:
        BACKEND_URL: http://api:4000
    image: g-scores-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
